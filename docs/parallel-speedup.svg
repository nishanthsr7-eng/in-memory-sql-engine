<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="640" height="420" fill="#ffffff"/>

  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">Parallel GROUP BY: speedup vs. thread count</text>
  <text x="320" y="42" text-anchor="middle" font-size="12" fill="#555">190,757-row fmcg_sales, GROUP BY brand + SUM(units_sold), vs. sequential HashAggregate</text>

  <rect x="80" y="20" width="480" height="320" fill="none" stroke="#ccc" stroke-width="1"/>

  <!-- horizontal gridlines: speedup 0,2,4,6,8 (y = 340 - speedup*40) -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="80" y1="340" x2="560" y2="340"/>
    <line x1="80" y1="260" x2="560" y2="260"/>
    <line x1="80" y1="180" x2="560" y2="180"/>
    <line x1="80" y1="100" x2="560" y2="100"/>
    <line x1="80" y1="20"  x2="560" y2="20"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="end">
    <text x="74" y="344">0x</text>
    <text x="74" y="264">2x</text>
    <text x="74" y="184">4x</text>
    <text x="74" y="104">6x</text>
    <text x="74" y="24">8x</text>
  </g>

  <!-- vertical gridlines: threads 1,2,4,8 (x = 80 + threads*60) -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="140" y1="20" x2="140" y2="340"/>
    <line x1="200" y1="20" x2="200" y2="340"/>
    <line x1="320" y1="20" x2="320" y2="340"/>
    <line x1="560" y1="20" x2="560" y2="340"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="140" y="356">1</text>
    <text x="200" y="356">2</text>
    <text x="320" y="356">4</text>
    <text x="560" y="356">8</text>
  </g>
  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#333">Threads</text>
  <text x="20" y="200" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90 20 200)">Speedup vs. sequential</text>

  <!-- ideal linear speedup reference -->
  <line x1="80" y1="340" x2="560" y2="20" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- measured speedup -->
  <polyline points="140,299.4 200,265.1 320,202.2 560,96.2" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <g fill="#2b6cb0">
    <circle cx="140" cy="299.4" r="4"/>
    <circle cx="200" cy="265.1" r="4"/>
    <circle cx="320" cy="202.2" r="4"/>
    <circle cx="560" cy="96.2" r="4"/>
  </g>

  <g font-size="11" fill="#2b6cb0" text-anchor="middle">
    <text x="140" y="292">1.0x</text>
    <text x="200" y="257">1.9x</text>
    <text x="320" y="194">3.4x</text>
    <text x="560" y="88">6.1x</text>
  </g>

  <!-- legend -->
  <g font-size="12">
    <line x1="330" y1="400" x2="354" y2="400" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="360" y="404" fill="#333">measured speedup</text>
    <line x1="480" y1="400" x2="504" y2="400" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="510" y="404" fill="#333">ideal (linear)</text>
  </g>
</svg>
